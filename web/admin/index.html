<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Ganium Admin</title>
  <link rel="stylesheet" href="/admin/static/styles.css" />
</head>
<body>
  <div class="container">
    <header>
      <h1>Ganium Admin</h1>
      <div id="status" class="status">Not signed in</div>
    </header>

    <main>
      <section id="login-section">
        <h2>Admin Login</h2>
        <form id="login-form">
          <label>Email</label>
          <input type="email" id="email" value="ganium.team@gmail.com" required />
          <label>Password</label>
          <input type="password" id="password" value="password123#" required />
          <button type="submit">Sign in</button>
        </form>
        <div id="login-msg" class="msg"></div>
      </section>

      <section id="dashboard-section" class="hidden">
        <h2>Dashboard</h2>
        <div id="dashboard"></div>
        <h3>Users</h3>
        <div id="users"></div>
      </section>
    </main>

    <footer>
      <small>Served from backend at /admin</small>
    </footer>
  </div>

  <script src="/admin/static/app.js"></script>
</body>
</html>
