basePath: /
definitions:
  models.BalanceSummary:
    properties:
      plans:
        items:
          $ref: '#/definitions/models.PaymentPlan'
        type: array
      wallet:
        $ref: '#/definitions/models.WalletSummary'
    type: object
  models.Login:
    properties:
      email:
        example: user@example.com
        type: string
      password:
        example: NewPassword123!
        type: string
    type: object
  models.NotificationUpdateRequest:
    properties:
      message:
        example: Your advanced scan finished with a suspicious verdict.
        type: string
      title:
        example: Scan complete
        type: string
    type: object
  models.PaymentPlan:
    properties:
      amount:
        type: number
      checkout_mode:
        type: string
      code:
        type: string
      currency:
        type: string
      description:
        type: string
      name:
        type: string
      tokens:
        type: integer
    type: object
  models.ReceiptRequest:
    properties:
      amount:
        example: 49.99
        type: number
      currency:
        example: NGN
        type: string
      description:
        example: Pro subscription payment
        type: string
      payer_email:
        example: user@example.com
        type: string
      payer_name:
        example: Jane Doe
        type: string
      payment_method:
        example: card
        type: string
      reference:
        example: PAY-20260821-001
        type: string
      status:
        example: success
        type: string
      transaction_date:
        example: "2026-08-21T08:30:00Z"
        type: string
    type: object
  models.RegisterRequest:
    properties:
      email:
        example: user@example.com
        type: string
      full_name:
        example: Jane Doe
        type: string
      password:
        example: NewPassword123!
        type: string
    type: object
  models.UserProfileResponse:
    properties:
      avatar_url:
        type: string
      created_at:
        type: string
      current_period_end:
        type: string
      email:
        type: string
      full_name:
        type: string
      isVerified:
        type: boolean
      last_scan_at:
        type: string
      solana_network:
        type: string
      solana_wallet_address:
        description: Solana
        type: string
      solana_wallet_connected:
        type: boolean
      solana_wallet_connected_at:
        type: string
      subscription_plan_id:
        type: string
      subscription_status:
        type: string
      tokens_remaining:
        type: integer
      tokens_used_total:
        type: integer
      updated_at:
        type: string
      wallet_balance:
        type: number
    type: object
  models.UserProfileUpdateRequest:
    properties:
      avatar_url:
        example: https://cdn.example.com/avatar.png
        type: string
      full_name:
        example: Jane Doe
        type: string
    type: object
  models.WalletSummary:
    properties:
      email:
        type: string
      solana_network:
        type: string
      solana_wallet_address:
        description: Solana
        type: string
      solana_wallet_connected:
        type: boolean
      solana_wallet_connected_at:
        type: string
      token_rate_per_usd:
        example: 10
        type: integer
      token_value_usd:
        example: 0.1
        type: number
      tokens_remaining:
        type: integer
      tokens_used_total:
        type: integer
      updated_at:
        type: string
      wallet_balance:
        type: number
    type: object
  routes.AdminForgotPasswordRequest:
    properties:
      email:
        example: admin@ganium.ai
        type: string
    type: object
  routes.AdminLoginRequest:
    properties:
      email:
        example: admin@ganium.ai
        type: string
      password:
        example: StrongPassword123!
        type: string
    type: object
  routes.AdminResetPasswordRequest:
    properties:
      email:
        example: admin@ganium.ai
        type: string
      newPassword:
        example: NewPassword123!
        type: string
      otp:
        example: "123456"
        type: string
    type: object
  routes.AdvanceScanRequest:
    properties:
      content:
        example: Claim your reward at https://secure-login-example.com/verify before
          it expires.
        type: string
    type: object
  routes.BasicScanRequest:
    properties:
      content:
        example: Your account will be suspended unless you confirm your password now.
        type: string
    type: object
  routes.ConnectSolanaWalletRequest:
    properties:
      network:
        type: string
      wallet_address:
        type: string
    type: object
  routes.CreateCryptoPaymentRequest:
    properties:
      plan:
        example: pro
        type: string
      token:
        example: USDT
        type: string
    type: object
  routes.ForgotPasswordRequest:
    properties:
      email:
        example: user@example.com
        type: string
    type: object
  routes.InvestigateRequest:
    properties:
      case_id:
        example: CASE-12345
        type: string
      investigation_id:
        example: INV-12345
        type: string
      network:
        example: ethereum
        type: string
      source:
        example: user
        type: string
      target:
        example: https://example.com
        type: string
      target_type:
        example: url
        type: string
    type: object
  routes.MessageScanRequest:
    properties:
      content:
        example: Please send the 0.5 ETH to this address right away so we can release
          the funds.
        type: string
    type: object
  routes.MidScanRequest:
    properties:
      content:
        example: We detected unusual activity. Please update your payment details
          immediately.
        type: string
    type: object
  routes.PaystackInitializeRequest:
    properties:
      callback:
        example: https://app.ganium.ai/payment/callback
        type: string
      callback_url:
        example: https://app.ganium.ai/payment/callback
        type: string
      callbackUrl:
        example: https://app.ganium.ai/payment/callback
        type: string
      mode:
        example: hosted
        type: string
      plan:
        example: pro
        type: string
      plan_code:
        example: pro
        type: string
      planCode:
        example: pro
        type: string
      planName:
        example: Pro
        type: string
      reference:
        example: GANIUM-123456
        type: string
    type: object
  routes.PaystackVerifyRequest:
    properties:
      reference:
        example: GANIUM-123456
        type: string
    type: object
  routes.ResendOTPRequest:
    properties:
      email:
        example: user@example.com
        type: string
    type: object
  routes.ResetPasswordRequest:
    properties:
      email:
        example: user@example.com
        type: string
      newPassword:
        example: NewPassword123!
        type: string
      token:
        example: reset-token
        type: string
    type: object
  routes.ScanRequest:
    properties:
      content:
        example: Congratulations! You have won a prize. Click this link now.
        type: string
    type: object
  routes.SubmitCryptoPaymentRequest:
    properties:
      payment_id:
        example: GAN-SJLY-123456789
        type: string
      signature:
        example: 5abc123...
        type: string
      user_wallet:
        example: 7abc123...
        type: string
    type: object
  routes.URLScanRequest:
    properties:
      content:
        example: https://secure-login-example.com/account/verify?session=123
        type: string
    type: object
  routes.VerifyOTPRequest:
    properties:
      email:
        example: user@example.com
        type: string
      otp:
        example: "123456"
        type: string
    type: object
  routes.WalletScanRequest:
    properties:
      content:
        example: 0x3fD2b5e4c7A9E2d6C1b8F0a3D4e5F67890123456
        type: string
    type: object
host: localhost:8080
info:
  contact:
    email: support@ganium.ai
    name: Ganium Support
  description: Ganium AI scam detection, security investigation, scanning, authentication
    and payment API.
  license:
    name: Proprietary
  termsOfService: https://ganium.ai/terms
  title: Ganium API
  version: "1.0"
paths:
  /admin/forgot-password:
    post:
      consumes:
      - application/json
      description: Starts the password recovery process for an admin account.
      parameters:
      - description: Admin email
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/routes.AdminForgotPasswordRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Admin forgot password
      tags:
      - Authentication
  /admin/login:
    post:
      consumes:
      - application/json
      description: Authenticates an administrator and returns a JWT token.
      parameters:
      - description: Admin login credentials
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/routes.AdminLoginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Admin login
      tags:
      - Authentication
  /admin/reset-password:
    post:
      consumes:
      - application/json
      description: Resets an admin password using a valid OTP.
      parameters:
      - description: Admin reset details
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/routes.AdminResetPasswordRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Admin reset password
      tags:
      - Authentication
  /api/admin/alerts:
    get:
      description: Returns recent security and account alerts for the admin overview.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Get admin alerts
      tags:
      - Admin
  /api/admin/dashboard:
    get:
      description: Returns the administrator dashboard summary and alert metrics.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Get admin dashboard
      tags:
      - Admin
  /api/admin/users:
    get:
      description: Returns all registered users for the platform admin.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: List users
      tags:
      - Admin
  /api/admin/users/{email}:
    delete:
      description: Deletes a user account from the admin panel.
      parameters:
      - description: User email
        in: path
        name: email
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Delete user
      tags:
      - Admin
    get:
      description: Returns the profile and account details for a single user.
      parameters:
      - description: User email
        in: path
        name: email
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Get user details
      tags:
      - Admin
    patch:
      consumes:
      - application/json
      description: Updates a user's profile data from the admin console.
      parameters:
      - description: User email
        in: path
        name: email
        required: true
        type: string
      - description: User fields to update
        in: body
        name: request
        required: true
        schema:
          additionalProperties: true
          type: object
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Update user details
      tags:
      - Admin
  /api/balance:
    get:
      description: Returns the current wallet balance together with the token pricing
        plans. The base plan is $1 for 10 tokens.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.BalanceSummary'
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Get balance and pricing
      tags:
      - Wallet
  /api/crypto/payment/create:
    post:
      consumes:
      - application/json
      description: Creates a pending crypto payment intent for SJLY, USDT, or USDC.
      parameters:
      - description: Crypto payment
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/routes.CreateCryptoPaymentRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Create crypto payment
      tags:
      - Crypto Payments
  /api/crypto/payment/status:
    get:
      description: Returns the current status of a crypto payment.
      parameters:
      - description: Crypto payment ID
        in: query
        name: payment_id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Get crypto payment status
      tags:
      - Crypto Payments
  /api/crypto/payment/stream:
    get:
      description: Streams the crypto payment status using Server-Sent Events.
      parameters:
      - description: Crypto payment ID
        in: query
        name: payment_id
        required: true
        type: string
      produces:
      - text/event-stream
      responses:
        "200":
          description: OK
          schema:
            type: string
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Stream crypto payment status
      tags:
      - Crypto Payments
  /api/crypto/payment/submit:
    post:
      consumes:
      - application/json
      description: Saves the Solana transaction signature for verification of a crypto payment.
      parameters:
      - description: Transaction
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/routes.SubmitCryptoPaymentRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Submit crypto transaction
      tags:
      - Crypto Payments
  /api/investigate:
    post:
      consumes:
      - application/json
      description: Runs the Ganium security investigation pipeline against a target.
      parameters:
      - description: Investigation request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/routes.InvestigateRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Run security investigation
      tags:
      - Investigation
  /api/me:
    delete:
      description: Deletes the authenticated user's account and related scans and
        payment history.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Delete current user account
      tags:
      - Users
    get:
      description: Returns the authenticated user's profile, token counts, and wallet
        balance.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.UserProfileResponse'
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Get current user profile
      tags:
      - Users
    patch:
      consumes:
      - application/json
      description: Updates editable profile fields for the authenticated user.
      parameters:
      - description: Profile update
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/models.UserProfileUpdateRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.UserProfileResponse'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Update current user profile
      tags:
      - Users
  /api/notifications:
    get:
      description: Returns all notifications belonging to the authenticated user,
        newest first.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: List notifications
      tags:
      - Notifications
  /api/notifications/{id}:
    delete:
      description: Deletes a single notification belonging to the authenticated user.
      parameters:
      - description: Notification ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Delete a notification
      tags:
      - Notifications
    patch:
      consumes:
      - application/json
      description: Updates editable fields on a notification belonging to the authenticated
        user.
      parameters:
      - description: Notification ID
        in: path
        name: id
        required: true
        type: string
      - description: Notification update
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/models.NotificationUpdateRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Update a notification
      tags:
      - Notifications
  /api/notifications/{id}/read:
    patch:
      description: Marks a single notification as read for the authenticated user.
      parameters:
      - description: Notification ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Mark a notification as read
      tags:
      - Notifications
  /api/paystack/callback:
    get:
      description: Handles Paystack payment callback.
      parameters:
      - description: Paystack transaction reference
        in: query
        name: reference
        required: true
        type: string
      - description: Payment status
        in: query
        name: status
        type: string
      produces:
      - application/json
      responses:
        "302":
          description: Found
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Paystack callback
      tags:
      - Paystack
  /api/paystack/initialize:
    post:
      consumes:
      - application/json
      description: Initializes a Paystack payment transaction.
      parameters:
      - description: Payment initialization
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/routes.PaystackInitializeRequest'
      produces:
      - application/json
